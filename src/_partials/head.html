  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f34b3f">
  <meta name="description" content="{{desc}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="Discover potential. Build with intent. Move games forward.">
  <meta property="og:type" content="website">
  <title>{{title}}</title>
  <script>
    // Pick light or dark before the page paints (saved choice, else the device setting)
    (function () {
      try {
        var saved = localStorage.getItem('rushed-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
